version: "3.9"

services:
  wmcp-jepa-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: wmcp-jepa-service:local
    ports:
      - "8080:8080"
    environment:
      WMCP_MODEL_ID: lewm-pusht
      WMCP_BACKEND: mock
      WMCP_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WMCP_ENABLE_PROMETHEUS: "true"
      WMCP_LOG_LEVEL: INFO
    # Enable this on a GPU host with NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      - otel-collector
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/wmcp-jepa.json:ro
