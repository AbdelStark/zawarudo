[project]
name = "wmcp-jepa-service"
version = "0.1.0"
description = "WMCP-aligned JEPA/action-conditioned world-model inference service skeleton"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0"
]

[project.optional-dependencies]
ray = ["ray[serve]>=2.30.0"]
torch = ["torch>=2.3.0", "torchvision>=0.18.0"]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
